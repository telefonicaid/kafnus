# Override used only when collecting kafnus-ngsi code coverage during the
# end-to-end tests (KAFNUS_TESTS_NGSI_COVERAGE=true). Node writes V8 coverage
# on a clean exit, so the grace period must cover the whole SIGTERM shutdown
# (~1s + up to 8s per consumer) or Docker SIGKILLs it and nothing is written.
services:
  kafnus-ngsi:
    environment:
      - NODE_V8_COVERAGE=/coverage
    volumes:
      - ${KAFNUS_NGSI_COVERAGE_DIR:?KAFNUS_NGSI_COVERAGE_DIR must be set}:/coverage
    stop_grace_period: 60s
